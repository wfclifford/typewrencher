# Typewrencher. Dedicated to the public domain under CC0 1.0 (see LICENSE).
# Runs the tests, the stamp check and a site build on every push and pull request to main; on main, publishes only the built site (see tools/build-site.js) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp check (fix stale stamps by running tools/stamp.js)
        run: node tools/stamp.js --check
      - name: Tests
        run: node tests/app.test.js
      - name: Build the site (fails if a file the page needs is not published)
        run: node tools/build-site.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release number is counted from the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Publish only the website's files (see tools/build-site.js), not tests, tools or the Mac app.
      # --release sets the release number shown in About: merges on main that changed a site file.
      - name: Build the site
        run: node tools/build-site.js --release
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages sometimes asks for the uploaded site a moment too early and reports "Found 0 artifact(s)" even though
      # the upload worked (it did on both v4 and v5). So a failed first attempt is retried once, after a pause, against the
      # artifact that is already uploaded. If the retry fails too, the job fails as before.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
