# Typewrencher. Dedicated to the public domain under CC0 1.0 (see LICENSE).
# Runs the tests, the stamp check and a site build on every push and pull request to main; on main, publishes only the built site (see tools/build-site.js) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp check (fix stale stamps by running tools/stamp.js)
        run: node tools/stamp.js --check
      - name: Tests
        run: node tests/app.test.js
      - name: Build the site (fails if a file the page needs is not published)
        run: node tools/build-site.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read # lets the wait step below list this run's artifacts
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release number is counted from the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Publish only the website's files (see tools/build-site.js), not tests, tools or the Mac app.
      # --release sets the release number shown in About: merges on main that changed a site file.
      - name: Build the site
        run: node tools/build-site.js --release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages looks the artifact up through GitHub's API about a second after the upload and sometimes finds
      # nothing yet ("Found 0 artifact(s)"), even though the upload succeeded. Wait (up to a minute) until it is listed,
      # then deploy. If it never shows up, carry on: deploy-pages reports the failure as it did before.
      - name: Wait until the uploaded site is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            echo "attempt $attempt: $count github-pages artifact(s) listed"
            if [ "$count" -ge 1 ]; then exit 0; fi
            sleep 5
          done
          echo "::warning::The uploaded site was not listed after a minute; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
